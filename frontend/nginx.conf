server {
    listen 80;
    server_name smartbotik.duckdns.org 217.160.48.54;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name smartbotik.duckdns.org 217.160.48.54;

    ssl_certificate /etc/letsencrypt/live/smartbotik.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartbotik.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 400 /error_pages/400.html;
    error_page 401 /error_pages/401.html;
    error_page 403 /error_pages/403.html;
    error_page 404 /error_pages/404.html;
    error_page 405 /error_pages/405.html;
    error_page 408 /error_pages/408.html;
    error_page 410 /error_pages/410.html;
    error_page 413 /error_pages/413.html;
    error_page 422 /error_pages/422.html;
    error_page 429 /error_pages/429.html;
    error_page 500 /error_pages/500.html;
    error_page 501 /error_pages/501.html;
    error_page 502 /error_pages/502.html;
    error_page 503 /error_pages/503.html;
    error_page 504 /error_pages/504.html;

    location ^~ /error_pages/ {
        internal;
        root /usr/share/nginx/html;
    }

    location = /preview-auth-check {
        internal;
        proxy_pass http://preview_auth:5000/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /preview-login {
        proxy_pass http://preview_auth:5000/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /preview-logout {
        proxy_pass http://preview_auth:5000/logout;
        proxy_set_header Host $host;
    }

    location / {
        auth_request /preview-auth-check;
        error_page 401 = @preview_redirect;

        try_files $uri $uri/ /index.html;

        location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
            auth_request /preview-auth-check;
            error_page 401 = @preview_redirect;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    location @preview_redirect {
        return 302 /preview-login?next=$request_uri;
    }

    location /api/ {
        auth_request /preview-auth-check;
        error_page 401 = @preview_redirect;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        client_max_body_size 10m;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}

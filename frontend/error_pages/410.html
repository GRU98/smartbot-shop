<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>410 — Сторінку видалено | SmartBot Shop</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}
.wrap{text-align:center;padding:40px 24px;max-width:480px}
.code{font-size:96px;font-weight:800;line-height:1;background:linear-gradient(135deg,#fff 0%,#666 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.title{font-size:22px;font-weight:600;margin:16px 0 10px}
.desc{color:#666;font-size:15px;line-height:1.6;margin-bottom:32px}
.btn{display:inline-block;padding:11px 28px;background:#fff;color:#000;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;transition:background .15s}
.btn:hover{background:#e5e5e5}
.badge{display:inline-block;margin-bottom:20px;padding:4px 12px;border:1px solid #222;border-radius:20px;font-size:12px;color:#555;letter-spacing:.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">SmartBot Shop</div>
  <div class="code">410</div>
  <div class="title">Сторінку видалено</div>
  <div class="desc">Цей ресурс більше не існує і не буде доступний. Можливо, він був видалений назавжди.</div>
  <a href="/" class="btn">На головну</a>
</div>
</body>
</html>
